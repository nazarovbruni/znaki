<style>
:root { --paper: #fff; --ink: #000; --signal: #d7141a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }

.btns { display: flex; flex-wrap: wrap; gap: 14px; }
.btn { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; text-decoration: none; color: var(--paper); background: var(--ink); border-radius: 999px; padding: 6px 22px 6px 6px; }
.btn b { width: 40px; height: 40px; border-radius: 50%; background: var(--signal); display: grid; place-items: center; }
.btn--light { background: var(--paper); color: var(--ink); border: 2px solid var(--ink); }
.btn:hover b { transform: translateX(-3px); }
